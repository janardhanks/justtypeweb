<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Create Account | JustTypeWeb</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <style>

        .auth-page {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 25px;
        }

        .auth-box {
            width: 100%;
            max-width: 430px;
            background: #101010;
            border: 1px solid #272727;
            border-radius: 20px;
            padding: 35px;
        }

        .auth-logo {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 35px;
        }

        .auth-box h1 {
            font-size: 38px;
            margin: 0 0 8px;
            letter-spacing: -.05em;
        }

        .auth-description {
            color: #777;
            margin-bottom: 30px;
        }

        .auth-field {
            margin-bottom: 16px;
        }

        .auth-field label {
            display: block;
            color: #888;
            font-size: 12px;
            margin-bottom: 8px;
        }

        .auth-field input {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: 1px solid #303030;
            background: #080808;
            color: white;
            outline: none;
        }

        .auth-field input:focus {
            border-color: #666;
        }

        .auth-submit {
            width: 100%;
            padding: 14px;
            border: 0;
            border-radius: 10px;
            background: #f5f5f2;
            color: #070707;
            font-weight: 700;
            margin-top: 10px;
        }

        .auth-message {
            min-height: 22px;
            margin-top: 15px;
            color: #ff5b52;
            font-size: 13px;
        }

        .auth-bottom {
            text-align: center;
            margin-top: 25px;
            color: #777;
            font-size: 14px;
        }

        .auth-bottom a {
            color: white;
        }

    </style>

</head>


<body>

<div class="auth-page">

    <div class="auth-box">

        <div class="auth-logo">
            J · JustTypeWeb
        </div>


        <h1>Join JustTypeWeb.</h1>

        <p class="auth-description">
            Create your account and just type.
        </p>


        <form id="signupForm">


            <div class="auth-field">

                <label>
                    Display name
                </label>

                <input
                    id="displayName"
                    type="text"
                    maxlength="40"
                    placeholder="Your name"
                    required
                >

            </div>


            <div class="auth-field">

                <label>
                    Username
                </label>

                <input
                    id="username"
                    type="text"
                    maxlength="20"
                    placeholder="janardhan"
                    pattern="[A-Za-z0-9_]+"
                    required
                >

            </div>


            <div class="auth-field">

                <label>
                    Email
                </label>

                <input
                    id="email"
                    type="email"
                    placeholder="you@example.com"
                    required
                >

            </div>


            <div class="auth-field">

                <label>
                    Password
                </label>

                <input
                    id="password"
                    type="password"
                    minlength="6"
                    placeholder="Minimum 6 characters"
                    required
                >

            </div>


            <button
                type="submit"
                class="auth-submit"
                id="signupButton"
            >
                Create account
            </button>


            <div
                id="authMessage"
                class="auth-message"
            ></div>

        </form>


        <div class="auth-bottom">

            Already have an account?

            <a href="login.html">
                Log in
            </a>

        </div>

    </div>

</div>


<script
    type="module"
    src="signup.js"
></script>

</body>

</html>
