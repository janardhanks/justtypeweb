<!doctype html>
<html lang="en"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Complete Profile | JustTypeWeb</title><link rel="stylesheet" href="style.css">
<style>
.auth-page{min-height:100vh;display:grid;place-items:center;padding:25px}.auth-box{width:100%;max-width:430px;background:#101010;border:1px solid #272727;border-radius:20px;padding:35px}.auth-box h1{font-size:36px;margin:0 0 8px}.auth-description{color:#777;margin-bottom:30px}.auth-field{margin-bottom:16px}.auth-field label{display:block;color:#888;font-size:12px;margin-bottom:8px}.auth-field input{width:100%;padding:14px;border-radius:10px;border:1px solid #303030;background:#080808;color:white;outline:none}.auth-submit{width:100%;padding:14px;border:0;border-radius:10px;background:#f5f5f2;color:#070707;font-weight:700}.auth-message{min-height:22px;margin-top:15px;color:#ff5b52;font-size:13px}
</style></head><body><div class="auth-page"><div class="auth-box">
<div class="auth-logo">J · JustTypeWeb</div><h1>Complete your profile.</h1><p class="auth-description">Choose your unique JustTypeWeb username.</p>
<form id="profileForm"><div class="auth-field"><label>Display name</label><input id="displayName" maxlength="40" required></div>
<div class="auth-field"><label>Username</label><input id="username" maxlength="20" pattern="[A-Za-z0-9_]{3,20}" placeholder="janardhan" required></div>
<button class="auth-submit" id="saveButton">Continue</button><div class="auth-message" id="authMessage"></div></form>
</div></div><script type="module" src="complete-profile.js"></script></body></html>
