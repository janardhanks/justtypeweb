<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | JustTypeWeb</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .auth-page {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 25px;
        }

        .auth-box {
            width: 100%;
            max-width: 430px;
            background: #101010;
            border: 1px solid #272727;
            border-radius: 20px;
            padding: 35px;
        }

        .auth-logo {
            font-size: 22px;
            font-weight: 700;
            margin-bottom: 35px;
        }

        .auth-box h1 {
            font-size: 38px;
            margin: 0 0 8px;
            letter-spacing: -0.05em;
        }

        .auth-description {
            color: #777;
            margin-bottom: 30px;
        }

        .auth-field {
            margin-bottom: 16px;
        }

        .auth-field label {
            display: block;
            font-size: 12px;
            color: #888;
            margin-bottom: 8px;
        }

        .auth-field input {
            width: 100%;
            padding: 14px;
            border-radius: 10px;
            border: 1px solid #303030;
            background: #080808;
            color: white;
            outline: none;
        }

        .auth-field input:focus {
            border-color: #666;
        }

        .auth-submit {
            width: 100%;
            padding: 14px;
            border: 0;
            border-radius: 10px;
            background: #f5f5f2;
            color: #070707;
            font-weight: 700;
            margin-top: 10px;
        }

        .auth-message {
            min-height: 22px;
            margin-top: 15px;
            font-size: 13px;
            color: #ff5b52;
        }

        .auth-bottom {
            text-align: center;
            margin-top: 25px;
            color: #777;
            font-size: 14px;
        }

        .auth-bottom a {
            color: white;
        }
    </style>
</head>

<body>

<div class="auth-page">

    <div class="auth-box">

        <div class="auth-logo">
            J · JustTypeWeb
        </div>

        <h1>Welcome back.</h1>

        <p class="auth-description">
            Log in to continue to JustTypeWeb.
        </p>

        <form id="loginForm">

            <div class="auth-field">
                <label>Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="you@example.com"
                    required
                >
            </div>

            <div class="auth-field">
                <label>Password</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Your password"
                    minlength="6"
                    required
                >
            </div>

            <button
                class="auth-submit"
                type="submit"
                id="loginButton"
            >
                Log in
            </button>

            <div
                class="auth-message"
                id="authMessage"
            ></div>

        </form>

        <div class="auth-bottom">
            Don't have an account?
            <a href="signup.html">Create one</a>
        </div>

    </div>

</div>

<script type="module" src="login.js"></script>

</body>
</html>
